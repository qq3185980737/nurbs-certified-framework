<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURBS 统一数值框架几何计算系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-panel: #252542;
            --border-color: #3d3d5c;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b0;
            --accent-cyan: #00d9ff;
            --accent-red: #ff6b6b;
            --accent-gold: #ffd700;
            --accent-purple: #a55eea;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 主布局 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* 画布区域 */
        .canvas-area {
            flex: 1;
            position: relative;
            background: var(--bg-secondary);
        }
        
        #mainCanvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        /* 侧边面板 */
        .side-panel {
            width: 420px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-header {
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-cyan);
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        /* 滚动条样式 */
        .panel-content::-webkit-scrollbar {
            width: 8px;
        }
        
        .panel-content::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
        .panel-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
        /* 表单元素 */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }
        
        .form-row {
            display: flex;
            gap: 10px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        /* 按钮样式 */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), #0099cc);
            color: #000;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
        }
        
        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .btn-secondary:hover {
            background: var(--border-color);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--accent-red), #cc5555);
            color: #fff;
        }
        
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }
        
        /* 卡片样式 */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 14px;
        }
        
        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-cyan);
        }
        
        /* 数据仪表盘 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .metric-item {
            background: var(--bg-primary);
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        
        .metric-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .metric-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-cyan);
            font-family: 'Courier New', monospace;
        }
        
        .metric-value.warning {
            color: var(--accent-gold);
        }
        
        .metric-value.error {
            color: var(--accent-red);
        }
        
        /* 状态指示器 */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-intersection {
            background: rgba(255, 215, 0, 0.2);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }
        
        .status-separated {
            background: rgba(165, 94, 234, 0.2);
            color: var(--accent-purple);
            border: 1px solid var(--accent-purple);
        }
        
        .status-tangent {
            background: rgba(255, 159, 67, 0.2);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }
        
        .status-undetermined {
            background: rgba(160, 160, 176, 0.2);
            color: var(--text-secondary);
            border: 1px solid var(--text-secondary);
        }
        
        /* 控制点列表 */
        .control-point-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        
        .control-point-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            gap: 8px;
        }
        
        .control-point-item:last-child {
            border-bottom: none;
        }
        
        .control-point-index {
            width: 24px;
            height: 24px;
            background: var(--accent-cyan);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
        }
        
        .control-point-inputs {
            flex: 1;
            display: flex;
            gap: 6px;
        }
        
        .control-point-inputs input {
            width: 60px;
            padding: 4px 6px;
            font-size: 11px;
        }
        
        /* 场景选择器 */
        .scenario-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .scenario-btn {
            padding: 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        
        .scenario-btn:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 217, 255, 0.1);
        }
        
        .scenario-btn.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 217, 255, 0.15);
        }
        
        /* 迭代历史 */
        .iteration-log {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            background: var(--bg-primary);
            padding: 10px;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .iteration-log-item {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        /* 标签页 */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            color: var(--text-secondary);
        }
        
        .tab:hover {
            color: var(--text-primary);
        }
        
        .tab.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 工具提示 */
        .tooltip {
            position: relative;
        }
        
        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 10px;
            background: #000;
            color: #fff;
            font-size: 11px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        
        .tooltip:hover::after {
            opacity: 1;
        }
        
        /* Toast 动画 */
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
        }
        
        .toolbar-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-right: auto;
        }
        
        /* 响应式调整 */
        @media (max-width: 1200px) {
            .side-panel {
                width: 360px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="toolbar-title">🔷 NURBS 统一数值框架几何计算系统</div>
        <button class="btn btn-primary" id="btnCompute">▶ 执行计算</button>
        <button class="btn btn-secondary" id="btnFitView">🔍 适应视图</button>
        <button class="btn btn-secondary" id="btnReset">↺ 重置</button>
        <button class="btn btn-secondary" id="btnDownload">⬇ 导出数据</button>
    </div>
    
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 画布区域 -->
        <div class="canvas-area">
            <canvas id="mainCanvas"></canvas>
        </div>
        
        <!-- 右侧面板 -->
        <div class="side-panel">
            <!-- 标签页导航 -->
            <div class="tabs">
                <div class="tab active" data-tab="curve1">曲线 1</div>
                <div class="tab" data-tab="curve2">曲线 2</div>
                <div class="tab" data-tab="results">结果</div>
                <div class="tab" data-tab="scenarios">场景</div>
            </div>
            
            <!-- 曲线 1 配置 -->
            <div class="panel-content tab-content active" id="tab-curve1">
                <div class="card">
                    <div class="card-title">基本参数</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">阶数 (Degree)</label>
                            <input type="number" class="form-input" id="curve1Degree" value="3" min="1" max="10">
                        </div>
                        <div class="form-group">
                            <label class="form-label">控制点数</label>
                            <input type="number" class="form-input" id="curve1ControlPoints" value="6" min="2" readonly>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Knot 类型</label>
                            <select class="form-input" id="curve1KnotType">
                                <option value="clamped">Clamped</option>
                                <option value="uniform">Uniform</option>
                                <option value="bezier">Bezier</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <button class="btn btn-secondary btn-sm" id="curve1AddPoint">+ 添加控制点</button>
                        <button class="btn btn-secondary btn-sm" id="curve1RemovePoint">- 移除控制点</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">控制点坐标</div>
                    <div class="control-point-list" id="curve1ControlPointsList"></div>
                </div>
                
                <div class="card">
                    <div class="card-title">权重设置</div>
                    <div class="control-point-list" id="curve1WeightsList"></div>
                </div>
            </div>
            
            <!-- 曲线 2 配置 -->
            <div class="panel-content tab-content" id="tab-curve2">
                <div class="card">
                    <div class="card-title">基本参数</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">阶数 (Degree)</label>
                            <input type="number" class="form-input" id="curve2Degree" value="3" min="1" max="10">
                        </div>
                        <div class="form-group">
                            <label class="form-label">控制点数</label>
                            <input type="number" class="form-input" id="curve2ControlPoints" value="6" min="2" readonly>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Knot 类型</label>
                            <select class="form-input" id="curve2KnotType">
                                <option value="clamped">Clamped</option>
                                <option value="uniform">Uniform</option>
                                <option value="bezier">Bezier</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <button class="btn btn-secondary btn-sm" id="curve2AddPoint">+ 添加控制点</button>
                        <button class="btn btn-secondary btn-sm" id="curve2RemovePoint">- 移除控制点</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">控制点坐标</div>
                    <div class="control-point-list" id="curve2ControlPointsList"></div>
                </div>
                
                <div class="card">
                    <div class="card-title">权重设置</div>
                    <div class="control-point-list" id="curve2WeightsList"></div>
                </div>
            </div>
            
            <!-- 计算结果 -->
            <div class="panel-content tab-content" id="tab-results">
                <div class="card">
                    <div class="card-title">几何状态</div>
                    <div style="text-align: center; padding: 20px;">
                        <span class="status-badge status-undetermined" id="geoStatus">未计算</span>
                    </div>
                    <p class="form-label" style="text-align: center; margin-top: 10px;" id="geoMessage">-</p>
                </div>
                
                <div class="card">
                    <div class="card-title">计算结果</div>
                    <div class="dashboard-grid">
                        <div class="metric-item">
                            <div class="metric-label">参数 u</div>
                            <div class="metric-value" id="resultU">-</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">参数 v</div>
                            <div class="metric-value" id="resultV">-</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">距离</div>
                            <div class="metric-value" id="resultDistance">-</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">残差</div>
                            <div class="metric-value" id="resultResidual">-</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">迭代次数</div>
                            <div class="metric-value" id="resultIterations">-</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">耗时 (ms)</div>
                            <div class="metric-value" id="resultTime">-</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">条件数 κ</div>
                            <div class="metric-value" id="resultCondition">-</div>
                        </div>
                    </div>
                    
                    <div style="margin-top: 14px;">
                        <div class="form-label">交点/最近点坐标</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">曲线 1 点</label>
                                <input type="text" class="form-input" id="resultPoint1" readonly>
                            </div>
                            <div class="form-group">
                                <label class="form-label">曲线 2 点</label>
                                <input type="text" class="form-input" id="resultPoint2" readonly>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">交点列表（<span id="resultCount">0</span>）</div>
                    <div class="form-label" id="proofStatus" style="margin:0 0 6px 0; color: var(--accent);">
                        Krawczyk 证明：—
                    </div>
                    <div class="iteration-log" id="resultList" style="max-height:220px; overflow:auto;">
                        <div class="form-label" style="text-align:center;">暂无数据</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">迭代历史</div>
                    <div class="iteration-log" id="iterationLog">
                        <div class="form-label" style="text-align: center;">暂无数据</div>
                    </div>
                </div>
            </div>
            
            <!-- 测试场景 -->
            <div class="panel-content tab-content" id="tab-scenarios">
                <div class="card">
                    <div class="card-title">预设场景</div>
                    <div class="scenario-grid">
                        <button class="scenario-btn" data-scenario="intersect1">✚ 普通相交</button>
                        <button class="scenario-btn" data-scenario="intersect2">✚✚ 多点相交</button>
                        <button class="scenario-btn" data-scenario="tangent1">⌒ 相切接触</button>
                        <button class="scenario-btn" data-scenario="tangent2">⌒ 高阶相切</button>
                        <button class="scenario-btn" data-scenario="separated1">⊘ 远距离分离</button>
                        <button class="scenario-btn" data-scenario="separated2">⊚ 近距离平行</button>
                        <button class="scenario-btn" data-scenario="endpoint">● 端点接触</button>
                        <button class="scenario-btn" data-scenario="circle">◯ 圆与曲线</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">求解器配置</div>
                    <div class="form-group">
                        <label class="form-label">网格采样密度</label>
                        <input type="range" class="form-input" id="gridDensity" min="3" max="15" value="7">
                        <div style="font-size: 11px; color: var(--text-secondary); text-align: right;" id="gridDensityValue">7×7</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">最大迭代次数</label>
                        <input type="number" class="form-input" id="maxIterations" value="100" min="10" max="1000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">收敛容差</label>
                        <select class="form-input" id="convergenceTolerance">
                            <option value="1e-6">1e-6 (宽松)</option>
                            <option value="1e-8" selected>1e-8 (标准)</option>
                            <option value="1e-10">1e-10 (严格)</option>
                            <option value="1e-12">1e-12 (极严)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <input type="checkbox" id="usePreFiltering" checked> 启用包围盒预筛选
                        </label>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">批量测试</div>
                    <button class="btn btn-secondary" style="width: 100%;" id="btnBatchTest">运行压力测试</button>
                    <div class="form-label" style="margin-top: 10px;" id="batchTestResult"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- C++/WASM 数学核（MODULARIZE 工厂，暴露全局 createNurbsModule）；须在 build bundle 之前加载 -->
    <script src="cpp/wasm/nurbs.js?v=20261019L"></script>

    <script>
        // ============================================================================
        // WASM 数学后端 + 渲染引擎 + 诊断 —— 由 build.mjs 从 src/ 自动生成，禁止手改。
        // 数学核单一事实来源：cpp/src/*.cpp（经 cpp/wasm/nurbs.wasm 供浏览器调用）；
        // 接入层：src/wasm_backend.js + src/render/canvas_engine.js + src/diagnostics.js
        // 修改数值/求解逻辑请编辑 cpp/src 后重建 WASM（见 cpp/wasm/README.md）；
        // 修改接入/渲染逻辑请编辑 src/ 后运行 `node build.mjs` 重新生成本段。
        // ============================================================================
(function () {
    'use strict';
    const __Nurbs = {};
// ---- module: nurbs-certified-framework/src/wasm_backend.js ----
// ============================================================================
// wasm_backend.js — 前端 WASM 数学后端（单源化接入层）
// ----------------------------------------------------------------------------
// 用 C++ 编译的 nurbs.wasm（cpp/wasm/nurbs.js + nurbs.wasm，MODULARIZE 工厂
// createNurbsModule）提供全部数值核，替换旧 JS 版 math_core + unified_solver。
// 暴露与旧数学核完全相同的顶层 API（createCurve / evaluatePoint / evaluatePoints
// / computeAABB / unifiedSolve / findAllIntersections / GeometryState），内部转发
// 到 WASM，从而让浏览器与 C++ 共享同一套算法（单源）。
//
// 环境无关：浏览器经 `<script src="cpp/wasm/nurbs.js">` 暴露全局 createNurbsModule；
// Node 测试可把工厂函数传入 initWasm(factory)。
// 由 build.mjs 内联进 index.html；本文件是唯一事实来源。
// ============================================================================

// ---- UI 工具：Knot 向量生成（纯 JS，非数值核；自 math_core.js 提取保留） ----
function generateUniformKnotVector(n, p) {
    const m = n + p; // Knot 向量索引上限
    const knots = new Array(m + 1);
    // 首尾重节点 (clamped)
    for (let i = 0; i <= p; i++) knots[i] = 0;
    for (let i = m - p; i <= m; i++) knots[i] = 1;
    // 中间均匀分布（内部节点数 = n-p-1）
    const internalKnotCount = n - p - 1;
    if (internalKnotCount > 0) {
        const step = 1 / (internalKnotCount + 1);
        for (let i = 1; i <= internalKnotCount; i++) knots[p + i] = i * step;
    }
    return knots;
}

function generatePiecewiseBezierKnotVector(n, p) {
    const segments = n - p; // 贝塞尔段数
    if (segments <= 0) throw new Error('控制点数量不足以生成分段贝兹曲线');
    const knots = [];
    for (let i = 0; i <= p; i++) knots.push(0);
    for (let i = 1; i < segments; i++) {
        const u = i / segments;
        for (let j = 0; j < p; j++) knots.push(u);
    }
    for (let i = 0; i <= p; i++) knots.push(1);
    return knots;
}

function generateKnotVector(degree, numControlPoints, knotType = 'clamped') {
    switch (knotType.toLowerCase()) {
        case 'uniform':
        case 'clamped':
            return generateUniformKnotVector(numControlPoints, degree);
        case 'bezier':
            return generatePiecewiseBezierKnotVector(numControlPoints, degree);
        default:
            console.warn(`未知的 Knot 类型 "${knotType}"，使用默认 clamped`);
            return generateUniformKnotVector(numControlPoints, degree);
    }
}

// ---- WASM 模块 / 曲线句柄管理 ----
let mod = null;
let wasmReadyPromise = null;
const curveCache = new WeakMap(); // curve -> {handle, knotsRef, weightsRef, ctrlRef, degree}

function initWasm(factory) {
    if (wasmReadyPromise) return wasmReadyPromise;
    wasmReadyPromise = (async () => {
        const f = factory || (typeof globalThis !== 'undefined' ? globalThis.createNurbsModule : null);
        if (typeof f !== 'function')
            throw new Error('createNurbsModule 不可用：请先通过 <script src="cpp/wasm/nurbs.js"> 加载 WASM');
        mod = await f();
        if (!mod || typeof mod._nurbs_curve_create !== 'function')
            throw new Error('WASM 模块初始化失败：导出缺失');
        return mod;
    })();
    return wasmReadyPromise;
}

function needMod() {
    if (!mod) throw new Error('WASM 数学核尚未初始化：请在 init() 中先 await initWasm()');
    return mod;
}

// 曲线句柄（懒建；跟随 knots/weights/degree 引用变更自动重建，兼容 UI 原地替换 knots）
function curveHandle(curve) {
    const m = needMod();
    let entry = curveCache.get(curve);
    if (entry && entry.knotsRef === curve.knots && entry.weightsRef === curve.weights
        && entry.ctrlRef === curve.controlPoints && entry.degree === curve.degree) {
        return entry.handle;
    }
    // 数据合法性校验：长度匹配 + 全部控制点/knots 为有限数。
    // 编辑中间态（输入未完成/含 null/NaN）一律沿用旧句柄，不触发 create，
    // 从而杜绝 validateCurve 抛异常 → destroy 悬垂句柄 → OOB 的死循环。
    const n = curve.controlPoints.length;
    const nk = curve.knots.length;
    if (nk !== n + curve.degree + 1) return entry ? entry.handle : null;
    for (let i = 0; i < n; i++) {
        const p = curve.controlPoints[i];
        if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.w))
            return entry ? entry.handle : null;
    }
    for (let i = 0; i < nk; i++) {
        if (!Number.isFinite(curve.knots[i])) return entry ? entry.handle : null;
    }
    // 先建新句柄，成功才销毁旧句柄并更新缓存（先建后删，无悬垂窗口）
    const cp = m._malloc(n * 3 * 8), kn = m._malloc(nk * 8);
    const c = cp / 8, k = kn / 8;
    for (let i = 0; i < n; i++) {
        m.HEAPF64[c + i * 3] = curve.controlPoints[i].x;
        m.HEAPF64[c + i * 3 + 1] = curve.controlPoints[i].y;
        m.HEAPF64[c + i * 3 + 2] = curve.controlPoints[i].w;
    }
    for (let i = 0; i < nk; i++) m.HEAPF64[k + i] = curve.knots[i];
    const out = m._malloc(8);
    let rc;
    try {
        rc = m._nurbs_curve_create(cp, n, kn, nk, curve.degree, out);
    } catch (e) {
        m._free(cp); m._free(kn); m._free(out);
        return entry ? entry.handle : null; // create 抛异常：保留旧句柄
    }
    const handle = m.HEAPU32[out >> 2];
    m._free(cp); m._free(kn); m._free(out);
    if (rc !== 0) return entry ? entry.handle : null; // create 失败：保留旧句柄
    if (entry && entry.handle) m._nurbs_curve_destroy(entry.handle);
    curveCache.set(curve, { handle, knotsRef: curve.knots, weightsRef: curve.weights, ctrlRef: curve.controlPoints, degree: curve.degree });
    return handle;
}

// ---- 公共 API（与原 math_core + unified_solver 同名同结构） ----
function createCurve(controlPoints, weights, knots, degree) {
    if (controlPoints.length !== weights.length)
        throw new Error('控制点数量必须与权重数量一致');
    const uMin = knots[degree];
    const uMax = knots[knots.length - 1 - degree];
    const weightedPoints = controlPoints.map((pt, i) => ({ x: pt.x, y: pt.y, w: weights[i] }));
    return { controlPoints: weightedPoints, weights, knots, degree, uMin, uMax };
}

function evaluatePoint(curve, u) {
    const m = needMod();
    const h = curveHandle(curve);
    const out = m._malloc(16);
    const rc = m._nurbs_evaluate_point(h, u, out, out + 8);
    if (rc !== 0) { m._free(out); throw new Error('WASM 求值失败 rc=' + rc); }
    const p = { x: m.HEAPF64[out >> 3], y: m.HEAPF64[(out + 8) >> 3] };
    m._free(out);
    return p;
}

function evaluatePoints(curve, uValues) {
    return uValues.map(u => evaluatePoint(curve, u));
}

function computeAABB(curve) {
    // NURBS 位于控制点凸包内：用控制点包围盒（含首末点）覆盖整条曲线，供视图适配
    const pts = curve.controlPoints;
    if (pts.length === 0) return { minX: 0, minY: 0, maxX: 0, maxY: 0 };
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of pts) {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
    return { minX, minY, maxX, maxY };
}

const STATE_STR = ['INTERSECTION', 'TANGENT', 'SEPARATED', 'COINCIDENT', 'UNDETERMINED'];

const GeometryState = {
    INTERSECTION: 'INTERSECTION',
    TANGENT: 'TANGENT',
    SEPARATED: 'SEPARATED',
    COINCIDENT: 'COINCIDENT',
    UNDETERMINED: 'UNDETERMINED'
};

// NurbsSolveResult 布局（C 结构，88B/条）：
//   state i32@0, pad, u@8, v@16, p1x@24, p1y@32, p2x@40, p2y@48, distance@56, iterations i32@64,
//   converged i32@68, residual@72, condition@80
function readSolveResult(m, base) {
    return {
        state: STATE_STR[m.HEAPU32[base >> 2]] || 'UNDETERMINED',
        u: m.HEAPF64[(base + 8) >> 3],
        v: m.HEAPF64[(base + 16) >> 3],
        point1: { x: m.HEAPF64[(base + 24) >> 3], y: m.HEAPF64[(base + 32) >> 3] },
        point2: { x: m.HEAPF64[(base + 40) >> 3], y: m.HEAPF64[(base + 48) >> 3] },
        distance: m.HEAPF64[(base + 56) >> 3],
        iterations: m.HEAPU32[(base + 64) >> 2],
        converged: m.HEAPU32[(base + 68) >> 2],
        residual: m.HEAPF64[(base + 72) >> 3],
        condition: m.HEAPF64[(base + 80) >> 3]
    };
}

// options: {usePreFiltering, gridSize, maxIterations, tolerance} —— 与 C API
// nurbs_unified_solve_ex 一一对应（equivalence 已证 JS/C++ 同参数逐位一致）
function unifiedSolve(curve1, curve2, options = {}) {
    const m = needMod();
    const h1 = curveHandle(curve1), h2 = curveHandle(curve2);
    const usePreFiltering = options.usePreFiltering !== undefined ? (options.usePreFiltering ? 1 : 0) : 1;
    const gridSize = options.gridSize !== undefined ? options.gridSize : 6;
    const maxIterations = options.maxIterations !== undefined ? options.maxIterations : 80;
    const tolerance = options.tolerance !== undefined ? options.tolerance : 0;
    const resPtr = m._malloc(8), nPtr = m._malloc(4);
    const rc = m._nurbs_unified_solve_ex(h1, h2, usePreFiltering, gridSize, maxIterations,
        tolerance, resPtr, nPtr);
    const n = m.HEAPU32[nPtr >> 2], res = m.HEAPU32[resPtr >> 2];
    const results = [];
    if (rc === 0 && n >= 1) {
        for (let i = 0; i < n; i++) results.push(readSolveResult(m, res + i * 88));
    } else if (rc !== 0) {
        // rc<0：INVALID(-1)/RUNTIME(-2)。无交点/退化几何属正常无解情形，
        // 按空结果返回，不作为致命错误抛出（避免连续切换场景时误报）。
        m._free(resPtr); m._free(nPtr);
        console.warn('[solve] unifiedSolve rc=', rc, '按无解处理');
        return [];
    }
    if (n >= 1) m._nurbs_solve_results_free(res);
    m._free(resPtr); m._free(nPtr);
    return results;
}

// NurbsRoot 布局（C 结构，64B/条）：
//   u@0, v@8, distance@16, p1x@24, p1y@32, p2x@40, p2y@48, iterations i32@56
// C 侧 find_all 固定容差 1e-8（无 tolerance 入参）；前端 options.tolerance 不生效，以 C++ 为准
function findAllIntersections(curve1, curve2, options = {}) {
    const m = needMod();
    const h1 = curveHandle(curve1), h2 = curveHandle(curve2);
    const rootsPtr = m._malloc(8), nPtr = m._malloc(4);
    const rc = m._nurbs_find_all_intersections(h1, h2, rootsPtr, nPtr);
    const n = m.HEAPU32[nPtr >> 2], roots = m.HEAPU32[rootsPtr >> 2];
    const out = [];
    if (rc === 0 && n >= 1) {
        for (let i = 0; i < n; i++) {
            const base = roots + i * 64;
            out.push({
                u: m.HEAPF64[base >> 3],
                v: m.HEAPF64[(base + 8) >> 3],
                distance: m.HEAPF64[(base + 16) >> 3],
                point1: { x: m.HEAPF64[(base + 24) >> 3], y: m.HEAPF64[(base + 32) >> 3] },
                point2: { x: m.HEAPF64[(base + 40) >> 3], y: m.HEAPF64[(base + 48) >> 3] },
                iterations: m.HEAPU32[(base + 56) >> 2]
            });
        }
    } else if (rc !== 0) {
        m._free(rootsPtr); m._free(nPtr);
        console.warn('[solve] findAllIntersections rc=', rc, '按无解处理');
        return [];
    }
    if (n >= 1) m._nurbs_roots_free(roots);
    m._free(rootsPtr); m._free(nPtr);
    return out;
}

// NurbsEnumerationResult 布局（C 结构，16B）：proven_count i32@0, tangent_count i32@4,
//   evaluated_boxes i32@8, complete i32@12
// 全局保证性枚举（区间细分 + Krawczyk 证明）：返回证明汇总，供前端显示 certified 状态。
function enumerateIntersections(curve1, curve2, leafTol = 1e-4) {
    const m = needMod();
    const h1 = curveHandle(curve1), h2 = curveHandle(curve2);
    const out = m._malloc(16);
    const rc = m._nurbs_enumerate_intersections(h1, h2, leafTol, out);
    let res = null;
    if (rc === 0) {
        res = {
            provenCount: m.HEAPU32[out >> 2],
            tangentCount: m.HEAPU32[(out + 4) >> 2],
            evaluatedBoxes: m.HEAPU32[(out + 8) >> 2],
            complete: m.HEAPU32[(out + 12) >> 2] ? true : false
        };
    } else {
        console.warn('[solve] enumerateIntersections rc=', rc);
    }
    m._free(out);
    return res;
}

// ============================================================================
// Canvas 渲染引擎 —— UI 使用的规范渲染器（由 index.html 内联副本迁出，单一事实来源）
// 由 build.mjs 打包注入 index.html；改动此处后运行 `node build.mjs` 同步到浏览器。
// 依赖：math_core(求值/AABB) + solver(GeometryState)
// ============================================================================
// 依赖：wasm_backend(求值/AABB/GeometryState，转发到 C++ WASM 数学核)


const COLORS = {
    background: '#1a1a2e', grid: '#2d2d44', gridMajor: '#3d3d5c', axis: '#4a4a6a',
    curve1: '#00d9ff', curve2: '#ff6b6b', controlPolygon1: 'rgba(0, 217, 255, 0.3)',
    controlPolygon2: 'rgba(255, 107, 107, 0.3)', controlPoint1: '#00a8cc', controlPoint2: '#ff5252',
    intersection: '#ffd700', text: '#e0e0e0'
};

class Viewport {
    constructor(width, height) {
        this.width = width; this.height = height;
        this.zoom = 1.0;
        this.offsetX = width / 2; this.offsetY = height / 2;
    }
    
    worldToScreen(wx, wy) {
        return { x: wx * this.zoom + this.offsetX, y: -wy * this.zoom + this.offsetY };
    }
    
    screenToWorld(sx, sy) {
        return { x: (sx - this.offsetX) / this.zoom, y: -(sy - this.offsetY) / this.zoom };
    }
    
    fitToBounds(bounds, padding = 0.1) {
        const rangeX = bounds.maxX - bounds.minX || 1;
        const rangeY = bounds.maxY - bounds.minY || 1;
        const scaleX = (this.width * (1 - 2 * padding)) / rangeX;
        const scaleY = (this.height * (1 - 2 * padding)) / rangeY;
        this.zoom = Math.min(scaleX, scaleY);
        const centerX = (bounds.minX + bounds.maxX) / 2;
        const centerY = (bounds.minY + bounds.maxY) / 2;
        this.offsetX = this.width / 2 - centerX * this.zoom;
        this.offsetY = this.height / 2 + centerY * this.zoom;
    }
}

class CanvasEngine {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.viewport = new Viewport(canvas.width, canvas.height);
        this._rafId = null;
        this.setupEventListeners();
        this._applyHiDPI();
    }
    
    // HiDPI：canvas 后台缓冲 = CSS 像素 × devicePixelRatio，绘制坐标保持 CSS 像素
    _applyHiDPI() {
        const dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
        if (dpr <= 1) return;
        const rect = this.canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const w = Math.round(rect.width * dpr);
        const h = Math.round(rect.height * dpr);
        if (this.canvas.width !== w) this.canvas.width = w;
        if (this.canvas.height !== h) this.canvas.height = h;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    
    // rAF 合并重绘：滚轮/拖拽等高频事件在一帧内只重绘一次，避免每次事件全量渲染卡顿
    requestRender() {
        if (this._rafId != null) return;
        this._rafId = requestAnimationFrame(() => {
            this._rafId = null;
            this.render();
        });
    }
    
    setupEventListeners() {
        const canvas = this.canvas;
        let isDragging = false, lastX = 0, lastY = 0;
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            this.viewport.zoom = Math.max(0.01, Math.min(100, this.viewport.zoom * delta));
            this.requestRender();
        }, { passive: false });
        
        canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                this.viewport.offsetX += e.clientX - lastX;
                this.viewport.offsetY += e.clientY - lastY;
                lastX = e.clientX; lastY = e.clientY;
                this.requestRender();
            }
        });
        canvas.addEventListener('mouseup', () => { isDragging = false; });
        
        window.addEventListener('resize', () => {
            const rect = canvas.getBoundingClientRect();
            this._applyHiDPI();
            this.viewport.width = rect.width; this.viewport.height = rect.height;
            this.viewport.offsetX = rect.width / 2; this.viewport.offsetY = rect.height / 2;
            this.requestRender();
        });
    }
    
    clear() {
        this.ctx.fillStyle = COLORS.background;
        this.ctx.fillRect(0, 0, this.viewport.width, this.viewport.height);
    }
    
    drawGrid() {
        const ctx = this.ctx, vp = this.viewport;
        ctx.strokeStyle = COLORS.grid; ctx.lineWidth = 1;
        const topLeft = vp.screenToWorld(0, 0);
        const bottomRight = vp.screenToWorld(vp.width, vp.height);
        const gridSize = vp.zoom > 5 ? 0.5 : vp.zoom > 2 ? 1 : vp.zoom < 0.5 ? 5 : 1;
        
        ctx.beginPath();
        for (let x = Math.floor(topLeft.x / gridSize) * gridSize; x <= bottomRight.x; x += gridSize) {
            const s = vp.worldToScreen(x, 0);
            ctx.moveTo(s.x, 0); ctx.lineTo(s.x, vp.height);
        }
        for (let y = Math.floor(bottomRight.y / gridSize) * gridSize; y <= topLeft.y; y += gridSize) {
            const s = vp.worldToScreen(0, y);
            ctx.moveTo(0, s.y); ctx.lineTo(vp.width, s.y);
        }
        ctx.stroke();
        
        ctx.strokeStyle = COLORS.axis; ctx.lineWidth = 2; ctx.beginPath();
        const xAxis = vp.worldToScreen(0, 0);
        ctx.moveTo(0, xAxis.y); ctx.lineTo(vp.width, xAxis.y);
        const yAxis = vp.worldToScreen(0, 0);
        ctx.moveTo(yAxis.x, 0); ctx.lineTo(yAxis.x, vp.height);
        ctx.stroke();
    }
    
    drawCurve(curve, color) {
        const ctx = this.ctx, vp = this.viewport;
        const points = [];
        const steps = Math.max(50, curve.controlPoints.length * 20);
        for (let i = 0; i <= steps; i++) {
            const u = curve.uMin + (curve.uMax - curve.uMin) * i / steps;
            try { points.push(evaluatePoint(curve, u)); } catch(e) {}
        }
        if (points.length === 0) return;
        
        ctx.beginPath();
        const start = vp.worldToScreen(points[0].x, points[0].y);
        ctx.moveTo(start.x, start.y);
        for (let i = 1; i < points.length; i++) {
            const s = vp.worldToScreen(points[i].x, points[i].y);
            ctx.lineTo(s.x, s.y);
        }
        ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    }
    
    drawControlPolygon(curve, color) {
        const ctx = this.ctx, vp = this.viewport;
        ctx.beginPath();
        const start = vp.worldToScreen(curve.controlPoints[0].x, curve.controlPoints[0].y);
        ctx.moveTo(start.x, start.y);
        for (let i = 1; i < curve.controlPoints.length; i++) {
            const s = vp.worldToScreen(curve.controlPoints[i].x, curve.controlPoints[i].y);
            ctx.lineTo(s.x, s.y);
        }
        ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
    }
    
    drawControlPoints(curve, color) {
        const ctx = this.ctx, vp = this.viewport;
        for (let i = 0; i < curve.controlPoints.length; i++) {
            const pt = curve.controlPoints[i];
            const s = vp.worldToScreen(pt.x, pt.y);
            ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = color; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        }
    }
    
    drawResult(result) {
        const ctx = this.ctx, vp = this.viewport;
        const s1 = vp.worldToScreen(result.point1.x, result.point1.y);
        
        ctx.beginPath(); ctx.arc(s1.x, s1.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 215, 0, 0.3)'; ctx.fill();
        ctx.beginPath(); ctx.arc(s1.x, s1.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = COLORS.intersection; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        
        if (result.state === GeometryState.SEPARATED && result.point2) {
            const s2 = vp.worldToScreen(result.point2.x, result.point2.y);
            ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y);
            ctx.strokeStyle = '#a55eea'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]); ctx.stroke(); ctx.setLineDash([]);
        }
    }
    
    render(curve1 = null, curve2 = null, results = []) {
        this.clear();
        this.drawGrid();
        if (curve1) {
            this.drawControlPolygon(curve1, COLORS.controlPolygon1);
            this.drawCurve(curve1, COLORS.curve1);
            this.drawControlPoints(curve1, COLORS.controlPoint1);
        }
        if (curve2) {
            this.drawControlPolygon(curve2, COLORS.controlPolygon2);
            this.drawCurve(curve2, COLORS.curve2);
            this.drawControlPoints(curve2, COLORS.controlPoint2);
        }
        for (const result of results) { this.drawResult(result); }
    }
    
    fitCurves(curve1, curve2) {
        const box1 = computeAABB(curve1), box2 = computeAABB(curve2);
        const combinedBox = {
            minX: Math.min(box1.minX, box2.minX),
            minY: Math.min(box1.minY, box2.minY),
            maxX: Math.max(box1.maxX, box2.maxX),
            maxY: Math.max(box1.maxY, box2.maxY)
        };
        this.viewport.fitToBounds(combinedBox, 0.15);
        this.render(curve1, curve2, []);
    }
}

/**
 * Diagnostics Module - 全局错误监控与诊断增强
 * 
 * 提供应用启动时的健康检查、错误捕获和 UI 提示功能。

/**
 * 初始化全局错误监控
 */
function initDiagnostics() {
    const errorContainer = createErrorContainer();
    
    // 捕获未处理的异常
    window.onerror = function(message, source, lineno, colno, error) {
        const errorInfo = {
            type: 'JavaScript Error',
            message: message,
            source: source,
            line: lineno,
            column: colno,
            stack: error ? error.stack : 'N/A'
        };
        displayError(errorInfo, errorContainer);
        console.error('[DIAGNOSTICS] Global Error:', errorInfo);
        return false;
    };
    
    // 捕获未处理的 Promise 拒绝
    window.onunhandledrejection = function(event) {
        const errorInfo = {
            type: 'Unhandled Promise Rejection',
            reason: event.reason,
            message: event.reason ? event.reason.message || String(event.reason) : 'Unknown reason'
        };
        displayError(errorInfo, errorContainer);
        console.error('[DIAGNOSTICS] Unhandled Rejection:', errorInfo);
    };
    
    console.log('[DIAGNOSTICS] Global error monitoring initialized');
}

    alertBox.innerHTML = `
        <div style="font-weight: 700; margin-bottom: 6px;">⚠️ ${errorInfo.type}</div>
        <div style="font-family: 'Courier New', monospace; font-size: 12px; opacity: 0.9;">
            ${escapeHtml(errorInfo.message)}
        </div>
        ${errorInfo.source ? `<div style="font-size: 11px; opacity: 0.7; margin-top: 4px;">📍 ${errorInfo.source}:${errorInfo.line}:${errorInfo.column}</div>` : ''}

    `;
    
    alertBox.addEventListener('click', () => {

    container.appendChild(alertBox);

async  function checkModuleHealth() {
    const healthReport = {
        modules: {},
        allLoaded: true,
        errors: []
    };
    
    const modulesToCheck = [
        { name: 'math_core', path: './nurbs/math_core.js' },
        { name: 'canvas_engine', path: './render/canvas_engine.js' },
        { name: 'unified_solver', path: './solver/unified_solver.js' }
    ];
    
    for (const mod of modulesToCheck) {
        try {
            await import(mod.path);
            healthReport.modules[mod.name] = { status: 'OK', loaded: true };
            console.log(`[HEALTH CHECK] ✅ ${mod.name} loaded successfully`);
        } catch (error) {
            healthReport.modules[mod.name] = { 
                status: 'FAILED', 
                loaded: false, 
                error: error.message 
            };
            healthReport.allLoaded = false;
            healthReport.errors.push({
                module: mod.name,
                message: error.message
            });
            console.error(`[HEALTH CHECK] ❌ ${mod.name} failed to load:`, error.message);
        }
    }
    
    return healthReport;
}

/**
 * Canvas 上下文检查
 */
function checkCanvasContext(canvas) {
    if (!canvas) {
        return {
            success: false,
            error: 'Canvas 元素未找到'
        };
    }
    
    const ctx = canvas.getContext('2d');
    
    if (!ctx) {
        return {
            success: false,
            error: '无法获取 Canvas 2D 上下文'
        };
    }
    
    return {
        success: true,
        context: ctx,
        width: canvas.width,
        height: canvas.height
    };
}

            const type = inputEl.dataset.type;
            const value = parseFloat(inputEl.value);
            
            if (type === 'x') {
                curve.controlPoints[index].x = value;
            } else {
                curve.controlPoints[index].y = value;
            }
            
            // 换新数组引用，触发 WASM curveHandle 缓存失效并重建句柄（同步最新控制点）
            curve.controlPoints = [...curve.controlPoints];
            
            updateCurves();
        }
        
        function updateWeight(curvePrefix, inputEl) {
            const curve = curvePrefix === 'curve1' ? curve1 : curve2;
            const index = parseInt(inputEl.dataset.weightIndex);
            const value = parseFloat(inputEl.value);
            
            curve.weights[index] = Math.max(0.001, value);
            // 换新数组引用，触发 WASM curveHandle 缓存失效并重建句柄（同步最新权重）
            curve.weights = [...curve.weights];
            updateCurves();
        }
        
        function addControlPoint(curvePrefix) {
            const curve = curvePrefix === 'curve1' ? curve1 : curve2;
            const lastPt = curve.controlPoints[curve.controlPoints.length - 1];
            
            curve.controlPoints.push({
                x: lastPt.x + 1,
                y: lastPt.y
            });
            curve.weights.push(1.0);
            // 换新数组引用，确保 WASM curveHandle 识别到增点并重建句柄
            curve.controlPoints = [...curve.controlPoints];
            curve.weights = [...curve.weights];
            
            // 重新生成 Knot 向量
            const degree = curve.degree;
            const knotType = document.getElementById(`${curvePrefix}KnotType`).value;
            curve.knots = generateKnotVector(degree, curve.controlPoints.length, knotType);
            
            updateControlPointsUI(curvePrefix);
            updateCurves();
        }
        
        function removeControlPoint(curvePrefix) {
            const curve = curvePrefix === 'curve1' ? curve1 : curve2;
            
            if (curve.controlPoints.length <= curve.degree + 1) {
                alert('控制点数量不能少于阶数 +1');
                return;
            }
            
            curve.controlPoints.pop();
            curve.weights.pop();
            // 换新数组引用，确保 WASM curveHandle 识别到删点并重建句柄
            curve.controlPoints = [...curve.controlPoints];
            curve.weights = [...curve.weights];
            
            const degree = curve.degree;
            const knotType = document.getElementById(`${curvePrefix}KnotType`).value;
            curve.knots = generateKnotVector(degree, curve.controlPoints.length, knotType);
            
            updateControlPointsUI(curvePrefix);
            updateCurves();
        }

            const logEl = document.getElementById('iterationLog'); if (logEl) logEl.innerHTML = '<div class="form-label" style="text-align: center;">暂无数据</div>';
        }

        // ========================================================================
        // 批量测试
        // ========================================================================
        
        function runBatchTest() {
            const btn = document.getElementById('btnBatchTest');
            const resultEl = document.getElementById('batchTestResult');
            
            btn.disabled = true;
            btn.textContent = '测试中...';
            resultEl.textContent = '';
            
            // 固定种子，保证两次运行结果一致（可复现）
            _stressSeed = 20261019;
            
            setTimeout(() => {
                let successCount = 0;
                let totalTests = 100;
                let avgIterations = 0;
                let condFinite = 0, condSingular = 0;
                let provenSum = 0, tangentSum = 0, completeOk = 0;
                const PROVE_SAMPLE = 25; // Krawczyk 证明汇总采样前 N 对（enumerate 开销大，避免页面假死）
                
                for (let i = 0; i < totalTests; i++) {
                    const randomCurve1 = generateRandomCurve();
                    const randomCurve2 = generateRandomCurve();
                    
                    try {
                        const results = unifiedSolve(randomCurve1, randomCurve2, {
                            gridSize: 5,
                            maxIterations: 50
                        });
                        
                        if (results.length > 0 && results[0].converged) {
                            successCount++;
                            avgIterations += results[0].iterations;
                            const c = results[0].condition;
                            if (c === Infinity || c === -Infinity) condSingular++;
                            else if (!Number.isNaN(c)) condFinite++;
                        }
                        
                        // Krawczyk 证明汇总（采样前 PROVE_SAMPLE 对，保持响应）
                        if (i < PROVE_SAMPLE) {
                            const proof = enumerateIntersections(randomCurve1, randomCurve2, 1e-4);
                            if (proof) {
                                provenSum += proof.provenCount || 0;
                                tangentSum += proof.tangentCount || 0;
                                if (proof.complete) completeOk++;
                            }
                        }
                    } catch (e) {
                        // 捕获异常
                    }
                }
                
                avgIterations /= Math.max(1, successCount);
                
                resultEl.innerHTML = `
                    <span style="color: var(--accent-cyan);">成功率：</span>${(successCount/totalTests*100).toFixed(1)}%（固定种子，可复现）<br>
                    <span style="color: var(--accent-cyan);">平均迭代：</span>${avgIterations.toFixed(1)}次<br>
                    <span style="color: var(--accent-cyan);">κ 有限 / 奇异：</span>${condFinite} / ${condSingular}<br>
                    <span style="color: var(--accent-cyan);">Krawczyk 可证 / 疑似相切：</span>${provenSum} / ${tangentSum}（前 ${PROVE_SAMPLE} 对）<br>
                    <span style="color: var(--accent-cyan);">全域覆盖：</span>${completeOk}/${Math.min(PROVE_SAMPLE, totalTests)}
                `;
                
                btn.disabled = false;
                btn.textContent = '运行压力测试';
            }, 100);
        }
        
        // 固定种子 PRNG：压力测试可复现（同 batch_test / stress_test 口径）
        let _stressSeed = 20261019;
        function _stressRnd() {
            _stressSeed = (_stressSeed * 1664525 + 1013904223) >>> 0;
            return _stressSeed / 4294967296;
        }
        function generateRandomCurve() {
            const degree = 3;
            const numPoints = 6;
            const controlPoints = [];
            const weights = [];
            
            for (let i = 0; i < numPoints; i++) {
                controlPoints.push({
                    x: (_stressRnd() - 0.5) * 10,
                    y: (_stressRnd() - 0.5) * 10
                });
                weights.push(0.5 + _stressRnd());
            }
            
            const knots = generateKnotVector(degree, numPoints, 'clamped');
            return createCurve(controlPoints, weights, knots, degree);
        }

                        state: currentResults[0].state,
                        message: currentResults[0].message,
                        u: currentResults[0].u,
                        v: currentResults[0].v,
                        distance: currentResults[0].distance,
                        residual: currentResults[0].residual,
                        iterations: currentResults[0].iterations,
                        converged: currentResults[0].converged,
                        point1: currentResults[0].point1,
                        point2: currentResults[0].point2,

                    solverConfig: {
                        gridSize: parseInt(document.getElementById('gridDensity').value),

                        tolerance: parseFloat(document.getElementById('convergenceTolerance').value),
                        usePreFiltering: document.getElementById('usePreFiltering').checked
                    }
                };
                
                const jsonString = JSON.stringify(exportData, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                
                // 兼容 file:// 协议的下载方案
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `nurbs_config_${new Date().getTime()}.json`;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // 延迟释放 URL
                setTimeout(() => URL.revokeObjectURL(url), 100);
                
                showToast('✅ 数据导出成功');
                console.log('[DOWNLOAD] ✅ 数据导出成功');
            } catch (error) {
                console.error('[DOWNLOAD] 导出失败:', error);
                alert(`数据导出失败：${error.message}\n\n提示：如果您使用的是 file://协议，某些浏览器可能限制下载功能。建议使用 Chrome 或 Firefox。`);
            }
        }
        
        function showToast(message, duration = 3000) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 217, 255, 0.9);
                color: #000;
                padding: 12px 24px;
                border-radius: 6px;
                font-size: 14px;
                font-weight: 600;
                z-index: 10000;
                box-shadow: 0 4px 12px rgba(0, 217, 255, 0.4);
                animation: slideUp 0.3s ease-out;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
